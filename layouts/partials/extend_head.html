<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | absURL }}">

<style>
  .tool-actions,
  .tool-card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: .65rem;
    margin: 1.25rem 0 1.75rem;
  }

  .tool-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 2.55rem;
    padding: .62rem .95rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--primary);
    background: var(--entry);
    font-weight: 600;
    line-height: 1.2;
    text-decoration: none;
  }

  .tool-button:hover {
    border-color: var(--primary);
  }

  .tool-button.primary {
    color: var(--theme);
    background: var(--primary);
    border-color: var(--primary);
  }

  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
    gap: 1rem;
    margin: 1.5rem 0;
  }

  .tool-card {
    padding: 1.1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--entry);
  }

  .tool-card h2 {
    margin: .25rem 0 .65rem;
    font-size: 1.35rem;
  }

  .tool-card p {
    margin: 0 0 .8rem;
  }

  .tool-eyebrow {
    color: var(--secondary);
    font-size: .85rem;
    letter-spacing: .02em;
  }

  .screenshot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr));
    gap: 1rem;
    margin: 1.25rem 0 2rem;
  }

  .screenshot-card {
    margin: 0;
  }

  .screenshot-card img {
    display: block;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--entry);
    box-shadow: 0 14px 34px rgba(0, 0, 0, .1);
  }

  .screenshot-card figcaption {
    margin-top: .55rem;
    color: var(--secondary);
    font-size: .82rem;
    text-align: center;
  }

  @media (max-width: 520px) {
    .tool-button {
      width: 100%;
    }
  }
</style>

{{ if .Params.mermaid }}
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('pre code.language-mermaid').forEach(function(el) {
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.parentElement.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: true });
  });
</script>
{{ end }}

<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "1123518bd53f45b087130cc4b7b852eb"}'></script>

{{/* Reading progress bar + completion mark — only on single article pages */}}
{{ if eq .Kind "page" }}
<style>
  .reading-progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    width: 0%;
    background: var(--primary);
    opacity: 0;
    transition: opacity .3s ease, width .06s linear;
    z-index: 9999;
    pointer-events: none;
  }
  .reading-progress-bar.is-visible { opacity: .55; }

  .reading-complete-mark {
    text-align: center;
    margin: 3rem 0 1rem;
    color: var(--secondary);
    font-size: .85rem;
    letter-spacing: .1em;
    opacity: 0;
    transition: opacity .8s ease;
  }
  .reading-complete-mark.is-visible { opacity: .6; }
</style>
<script>
(function () {
  function init() {
    var article = document.querySelector('article.post-single')
               || document.querySelector('article')
               || document.querySelector('main .post-content');
    if (!article) return;

    var bar = document.createElement('div');
    bar.className = 'reading-progress-bar';
    document.body.appendChild(bar);

    var mark = document.createElement('div');
    mark.className = 'reading-complete-mark';
    mark.textContent = '— 讀到這裡了 —';
    article.appendChild(mark);

    var ticking = false;
    var completedOnce = false;

    function update() {
      var rect = article.getBoundingClientRect();
      var topAbs = rect.top + window.scrollY;
      var h = article.offsetHeight;
      var vh = window.innerHeight;
      var sy = window.scrollY;

      // progress: 0 = article entering viewport, 1 = article bottom reaches viewport bottom
      var start = topAbs - vh * 0.2;
      var end = topAbs + h - vh;
      var p = end > start ? (sy - start) / (end - start) : 0;
      p = Math.max(0, Math.min(1, p));

      bar.style.width = (p * 100) + '%';

      // show after 100px scrolled, hide once nearly done
      if (sy > 100 && p > 0.02 && p < 0.97) {
        bar.classList.add('is-visible');
      } else {
        bar.classList.remove('is-visible');
      }

      // reveal "讀到這裡了" once at 95%
      if (p >= 0.95 && !completedOnce) {
        completedOnce = true;
        mark.classList.add('is-visible');
      }

      ticking = false;
    }

    function onScroll() {
      if (!ticking) {
        requestAnimationFrame(update);
        ticking = true;
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    update();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
{{ end }}
